<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pokédex</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <h1>Pokédex</h1>
  <ul class="liste">
    {{range .Pokemons}}
    <li>
      <a href="/pokemon/{{.Numero}}">
        <img src="{{.Sprites.Image}}" alt="{{.Nom.Nom}}">
        <span>n°{{.Numero}} {{.Nom.Nom}}</span>
      </a>
    </li>
    {{else}}
    <li>Aucun Pokémon à afficher.</li>
    {{end}}
  </ul>

  <footer>Données fournies par Tyradex (https://tyradex.app)</footer>
</body>
</html>
