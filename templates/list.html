<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pokédex</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <h1>Pokédex</h1>
  <form action="/pokemon" method="get">
    <input type="text" name="nom" value="{{.Recherche}}" placeholder="Nom du Pokémon">
    <button type="submit">Rechercher</button>
  </form>
  <ul class="liste">
    {{range .Pokemons}}
    <li>
      <a href="/pokemon/{{.Numero}}" class="{{with .Types}}{{with index . 0}}type-{{.Nom}}{{end}}{{end}}">
        <img src="{{.Sprites.Image}}" alt="{{.Nom.Nom}}">
        <small>{{printf "#%03d" .Numero}}</small>
        <span>{{.Nom.Nom}}</span>
      </a>
    </li>
    {{else}}
    {{if .Recherche}}
    <li>Aucun Pokémon ne correspond à « {{.Recherche}} ».</li>
    {{else}}
    <li>Aucun Pokémon à afficher.</li>
    {{end}}
    {{end}}
  </ul>

  <footer>Données fournies par Tyradex (https://tyradex.app)</footer>
</body>
</html>
